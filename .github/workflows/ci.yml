name: CI

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run
        env:
          # Lean is not installed on the runner; the Lean integration tests
          # skip themselves when `lake` is not on PATH.
          LLM_API_KEY: ""

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXTAUTH_SECRET: ci-only-not-a-real-secret
          DATABASE_URL: file:./ci.db

  compute:
    name: compute server (python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Byte-compile
        run: python -m py_compile scripts/compute-server.py scripts/compute-server-v2.py scripts/safe_parse.py scripts/solve/*.py

      - name: Safe-parse smoke test
        run: python scripts/test_safe_parse.py
