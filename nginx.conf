# Reverse proxy for the invite-only beta (docs 7e): the only container with public ports.
# HTTPS with the certificate in ./certs (fullchain.pem + privkey.pem, e.g. from certbot);
# HTTP only redirects (and serves ACME challenges from ./certs/acme for renewals).
# Streaming responses (solve progress as SSE, generation progress as NDJSON) pass through
# unbuffered, with long read timeouts: a solve can run for many minutes.

events {
    worker_connections 1024;
}

http {
    upstream web {
        server web:3000;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Uploads: problem photos, scanned papers for question banks.
    client_max_body_size 50m;

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /etc/nginx/certs/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sign-in: stricter rate limit.
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://web;
        }

        # API: no buffering (SSE / NDJSON progress must arrive as it is written, and a closed
        # page must reach the server so the solve is cancelled), long timeouts.
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://web;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }

        location /_next/static/ {
            proxy_pass http://web;
            expires 30d;
        }

        location / {
            proxy_pass http://web;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }
    }
}
