# Invite-only beta deployment (docs 7e; guide: docs/BETA-DEPLOY.md).
#
#   cp .env.production.example .env.production   # fill it in
#   docker compose up -d --build
#
# Only nginx has public ports (80 → redirect, 443). The app, the compute server and Neo4j are
# reachable only on the internal network. State lives on the app-data volume (back it up:
# scripts/backup.sh). The knowledge graph (Neo4j) is optional: `--profile knowledge`.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - AUTH_REQUIRED=true
      - DATABASE_URL=file:/app/data/prod.db
      # Sessions, usage (quotas), question banks, proof memory and invites on the volume.
      - SQLITE_DB_PATH=/app/data/sessions.db
      - QUOTA_DB_PATH=/app/data/usage.db
      - SESSION_STORE_PATH=/app/data/sessions
      - BANK_STORE_PATH=/app/data/banks
      - PROOF_MEMORY_PATH=/app/data/proof-memory.json
      - INVITE_FILE=/app/data/invites.txt
      - LEAN_SANDBOX_PATH=/app/lean-sandbox
      - COMPUTE_ENGINE_URL=http://compute:8765
    expose:
      - "3000"
    volumes:
      - app-data:/app/data
    depends_on:
      - compute
    # Lean workers take ~1.5–2 GB each with Mathlib loaded: size the limit to
    # SOLVE_CONCURRENCY × LEAN_REPL_WORKERS.
    mem_limit: 12g
    pids_limit: 512
    restart: unless-stopped

  compute:
    build:
      context: .
      dockerfile: Dockerfile.compute
    expose:
      - "8765"
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    restart: unless-stopped

  # Optional knowledge graph (set NEO4J_URI=bolt://neo4j:7687 and NEO4J_PASSWORD in .env.production).
  neo4j:
    image: neo4j:5-community
    profiles: ["knowledge"]
    expose:
      - "7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    restart: unless-stopped

volumes:
  app-data:
  neo4j-data:
  neo4j-logs:
